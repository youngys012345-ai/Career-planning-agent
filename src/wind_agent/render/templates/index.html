<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职向标 · 求职风向助手</title>
<link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/landing.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/motion.css?v={{ asset_v }}">
</head>
<body class="landing">
<div class="page-bg" aria-hidden="true">
  <span class="page-bg__wash page-bg__wash--a"></span>
  <span class="page-bg__wash page-bg__wash--b"></span>
  <span class="page-bg__wash page-bg__wash--c"></span>
  <span class="page-bg__grid"></span>
</div>
<div class="wrap">
  <div class="gate motion-enter">
    <div class="brand-block motion-stagger">
      <span class="chip">Market-first · 市场风向驱动</span>
      <h1 class="product-name" aria-label="职向标">
        <span class="product-name__mark" aria-hidden="true"></span>
        <span class="product-name__text">
          <span class="product-name__char" style="--i:0">职</span>
          <span class="product-name__char" style="--i:1">向</span>
          <span class="product-name__char" style="--i:2">标</span>
        </span>
      </h1>
      <p class="brand-sub">求职风向助手</p>
      <span class="brand-underline" aria-hidden="true"></span>
    </div>
    <p class="tagline motion-stagger">面向在校大学生，根据意愿方向和真实市场需求，告诉你应该如何进行求职准备</p>
    <form id="f">
      <span class="field-label motion-stagger" id="dirLabel">推荐方向</span>
      <div class="opts motion-stagger" id="dirOpts" role="group" aria-labelledby="dirLabel">
        <button type="button" class="opt on" data-v="数据分析" data-query="我现在是大二统计专业学生，以后想找数据分析岗位工作，我应该如何准备。">数据分析</button>
        <button type="button" class="opt" data-v="产品经理" data-query="我是大三商科学生，想转产品经理方向，需要补哪些能力和项目经验？">产品经理</button>
        <button type="button" class="opt" data-v="后端开发" data-query="我是计算机大二学生，目标后端开发岗，该如何规划实习与技术栈学习？">后端开发</button>
        <button type="button" class="opt" data-v="算法" data-query="我是大二学生，以后想做算法工程师（含 Agent/大模型方向），应该如何准备？">算法</button>
      </div>
      <input id="direction" name="direction" type="hidden" value="数据分析">

      <label class="motion-stagger" for="query">你的意愿 / 问题</label>
      <textarea class="motion-stagger" id="query" name="query" rows="3" placeholder="点选推荐方向可自动填充；也可直接改写。&#10;回车生成报告，Shift+Enter 换行">我现在是大二统计专业学生，以后想找数据分析岗位工作，我应该如何准备。</textarea>

      <button class="motion-stagger" type="submit" id="btn">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-label">生成风向报告</span>
      </button>
      <div id="status" class="motion-stagger"></div>
      <p class="hint motion-stagger">先选推荐方向，再按需改写提问；回车生成，Shift+Enter 换行。</p>
    </form>
  </div>
</div>
<script src="/static/js/motion.js?v={{ asset_v }}"></script>
<script src="/static/js/landing.js?v={{ asset_v }}"></script>
</body>
</html>
