# 求职风向标 · 公网 Nginx 反代（HTTPS）
# 正式域名：www.jobwindmark.bond（备案通过后再启用）
# 上游：本机 uvicorn http://127.0.0.1:8765
#
# 限流区请先在 http{} 中 include：
#   include /etc/nginx/conf.d/wind_agent_limit_req.conf;

# HTTP → HTTPS（www 为主站）
server {
    listen 80;
    listen [::]:80;
    server_name www.jobwindmark.bond jobwindmark.bond;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.jobwindmark.bond$request_uri;
    }
}

# 裸域 → www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobwindmark.bond;

    ssl_certificate     /etc/letsencrypt/live/www.jobwindmark.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jobwindmark.bond/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.jobwindmark.bond$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jobwindmark.bond;

    ssl_certificate     /etc/letsencrypt/live/www.jobwindmark.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jobwindmark.bond/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 基础安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    client_max_body_size 2m;

    location /static/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        limit_req zone=wind_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
